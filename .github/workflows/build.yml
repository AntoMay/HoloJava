name: HoloJava CI - Development Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle/Maven dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2
            ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Install ProGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y proguard

      - name: Install dependencies
        run: |
          chmod +x ./tools/*.sh
          ./tools/build_all.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holojava-build-dev
          path: dist/